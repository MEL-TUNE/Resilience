<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>オトノハ｜マイク2つの確かめ</title>
<style>
:root{--ink:#2e211c;--paper:#fffaf3;--line:#d9c7a8;--accent:#8a4b5e;--ok:#3f7a52;--ng:#b8323f}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:var(--ink);background:#f3ead9;line-height:1.6}
main{max-width:560px;margin:0 auto;padding:18px 14px 40px}
h1{font-size:19px;margin:0 0 6px}p{margin:6px 0}.note{font-size:13px;color:#6d5c4e}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:14px}
button{font:inherit;font-weight:700;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:12px;padding:12px 16px;width:100%;min-height:48px}
button:disabled{opacity:.5}
label{display:block;font-size:13px;font-weight:700;margin-top:10px}
select{width:100%;font-size:16px;padding:8px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-top:4px}
.meter{height:16px;border-radius:8px;background:#ead9c2;overflow:hidden;margin-top:6px}.meter i{display:block;height:100%;width:0;background:var(--accent);transition:width .05s}
.res{font-weight:700;font-size:15px;margin-top:12px;white-space:pre-line}.res.ok{color:var(--ok)}.res.ng{color:var(--ng)}
</style>
</head>
<body>
<main>
<h1>マイク2つの確かめ</h1>
<p class="note">iPhone・iPad で「録音は AG03 などの機材から、口パクは本体のマイクから」と、2つのマイクを同時に使えるかを確かめるページです。音はどこにも送らず、保存もしません。</p>
<div class="card">
<p>① 機材（AG03 など）をつないだまま、下のボタンを押してマイクを許可します。</p>
<button type="button" id="start">マイクを許可して一覧を出す</button>
<label>録音に使うマイク（A）<select id="selA" disabled></select></label>
<div class="meter"><i id="mA"></i></div>
<label>口パクに使うマイク（B）<select id="selB" disabled></select></label>
<div class="meter"><i id="mB"></i></div>
<p class="note">② A と B に違うマイクを選び、「2つ同時に開く」を押します。③ 歌わずに、本体のマイクのあたりを指で軽くこすったり、機材のマイクに向かって声を出したりして、2本の帯が別々に動くかを見ます。</p>
<button type="button" id="both" disabled>2つ同時に開く</button>
<div class="res" id="res"></div>
</div>
</main>
<script>
'use strict';
const $=s=>document.querySelector(s);let ctx,streams=[],raf=0;
const stopAll=()=>{cancelAnimationFrame(raf);streams.forEach(s=>s.getTracks().forEach(t=>t.stop()));streams=[]};
function fill(list){for(const sel of [$('#selA'),$('#selB')]){sel.innerHTML=list.map((d,i)=>`<option value="${d.deviceId}">${(d.label||'マイク '+(i+1)).replace(/[<>&]/g,'')}</option>`).join('');sel.disabled=false}if(list.length>1)$('#selB').selectedIndex=1;$('#both').disabled=false}
$('#start').onclick=async()=>{
  try{const s=await navigator.mediaDevices.getUserMedia({audio:true});s.getTracks().forEach(t=>t.stop());
    const list=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='audioinput');
    fill(list);$('#res').className='res';$('#res').textContent='見つかったマイク：'+list.length+'つ\n'+list.map(d=>'・'+(d.label||'（名前なし）')).join('\n')+(list.length<2?'\n\nこの端末では、選べるマイクが1つしか出ていません。2つ同時には使えない可能性が高いです。':'')}
  catch(e){$('#res').className='res ng';$('#res').textContent='マイクを開けませんでした（'+e.name+'）'}
};
$('#both').onclick=async()=>{
  stopAll();const a=$('#selA').value,b=$('#selB').value;
  if(a===b){$('#res').className='res ng';$('#res').textContent='A と B に違うマイクを選んでください';return}
  try{
    ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();
    const open=id=>navigator.mediaDevices.getUserMedia({audio:{deviceId:{exact:id},echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    const sA=await open(a),sB=await open(b);streams=[sA,sB];
    const live=s=>s.getAudioTracks()[0]?.readyState==='live';
    const an=[sA,sB].map(s=>{const x=ctx.createAnalyser();x.fftSize=1024;ctx.createMediaStreamSource(s).connect(x);return x});
    const buf=new Float32Array(1024);let diff=0,n=0;
    const tick=()=>{const lv=an.map(x=>{x.getFloatTimeDomainData(buf);let p=0;for(const v of buf)p=Math.max(p,Math.abs(v));return p});
      $('#mA').style.width=Math.min(100,lv[0]*300)+'%';$('#mB').style.width=Math.min(100,lv[1]*300)+'%';
      if(Math.max(lv[0],lv[1])>.02){n++;if(Math.abs(lv[0]-lv[1])>.5*Math.max(lv[0],lv[1]))diff++}
      raf=requestAnimationFrame(tick)};tick();
    const la=sA.getAudioTracks()[0].label,lb=sB.getAudioTracks()[0].label;
    setTimeout(()=>{const both=live(sA)&&live(sB);
      $('#res').className='res '+(both?'ok':'ng');
      $('#res').textContent=(both?'2つとも開いています。':'片方が止まりました。この端末では2つ同時に使えない可能性が高いです。')+'\nA：'+(la||'（名前なし）')+(live(sA)?'（動いています）':'（止まりました）')+'\nB：'+(lb||'（名前なし）')+(live(sB)?'（動いています）':'（止まりました）')+'\n\n2本の帯が別々に動けば、2つ同時に使えています。同じように動くなら、同じマイクの音が2つに届いているだけです。'},1500);
  }catch(e){stopAll();$('#res').className='res ng';$('#res').textContent='2つ同時には開けませんでした（'+e.name+'：'+(e.message||'')+'）。この端末では、同時に使えるマイクは1つのようです。'}
};
window.addEventListener('pagehide',stopAll);
</script>
</body>
</html>
